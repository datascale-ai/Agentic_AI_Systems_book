site_name: 智能体人工智能系统：从大语言模型到现实世界智能体
site_url: https://example.github.io/Agentic_AI_Systems_book/
site_description: 从大语言模型到现实世界智能体的系统工程书稿
site_author: Agentic AI Systems Book Contributors

# Planning artifacts live outside docs/ and are ignored by Git; only public manuscript
# sources under docs/ are included in the site.

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换至夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换至日间模式

plugins:
  - search
  - glightbox
  - i18n:
      reconfigure_material: true
      docs_structure: folder
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
          site_name: 智能体人工智能系统：从大语言模型到现实世界智能体
          nav:
            - 智能体人工智能系统: index.md
            - 读者指南与引言: reader_guide.md
            - 缩略语与符号表: abbreviations.md
            - 作者信息: authors.md
            - 图表目录: figures_tables.md
            - 公共资产与合稿协议: asset_contract.md
            - 前言: preface.md
            - 致谢: acknowledgements.md
            - 第一篇：智能体人工智能系统基础:
                - 本篇目录: part1/index.md
                - 第1章：智能体人工智能概论: part1/ch01_agentic_ai_overview.md
                - 第2章：从大语言模型到 AI 智能体: part1/ch02_from_llms_to_agents.md
                - 第3章：智能体架构基础: part1/ch03_agent_architecture.md
                - 第4章：智能体系统生命周期与设计原则: part1/ch04_system_lifecycle_design.md
            - 第二篇：模型交互与推理基础:
                - 本篇目录: part2/index.md
                - 第5章：提示与指令层级: part2/ch05_prompt_instruction_hierarchies.md
                - 第6章：上下文工程与结构化输出: part2/ch06_context_structured_outputs.md
                - 第7章：模型选择、路由与能力契约: part2/ch07_model_routing_contracts.md
                - 第8章：基础模型推理: part2/ch08_foundation_model_reasoning.md
            - 第三篇：智能体核心能力:
                - 本篇目录: part3/index.md
                - 第9章：任务分解与规划: part3/ch09_task_decomposition_planning.md
                - 第10章：迭代推理与计划修订: part3/ch10_iterative_reasoning_revision.md
                - 第11章：工具发现、选择与调用: part3/ch11_tool_discovery_calling.md
                - 第12章：行动执行与外部操作: part3/ch12_action_execution.md
                - 第13章：行动轨迹、验证与恢复: part3/ch13_action_traces_recovery.md
            - 第四篇：记忆、知识与智能体学习:
                - 本篇目录: part4/index.md
                - 第14章：智能体状态、工作记忆与上下文管理: part4/ch14_state_working_memory_context.md
                - 第15章：长期记忆与个性化: part4/ch15_long_term_memory.md
                - 第16章：检索增强与知识驱动智能体: part4/ch16_retrieval_knowledge_agents.md
                - 第17章：反思、自我纠错与持续适应: part4/ch17_reflection_adaptation.md
            - 第五篇：多智能体与环境交互系统:
                - 本篇目录: part5/index.md
                - 第18章：多智能体角色与组织结构: part5/ch18_multi_agent_roles.md
                - 第19章：多智能体通信与协调: part5/ch19_multi_agent_communication.md
                - 第20章：集体推理、辩论与协商: part5/ch20_collective_reasoning.md
                - 第21章：智能体感知与环境交互: part5/ch21_perception_environment.md
            - 第六篇：运行时工程与交互基础设施:
                - 本篇目录: part6/index.md
                - 第22章：智能体编排与执行运行时: part6/ch22_orchestration_runtime.md
                - 第23章：会话、事件与状态机: part6/ch23_sessions_events_state.md
                - 第24章：流式流水线、流量控制与用户打断: part6/ch24_streaming_interrupts.md
                - 第25章：多模态交互与实时协调: part6/ch25_multimodal_realtime.md
            - 第七篇：评估、可信性与生产治理:
                - 本篇目录: part7/index.md
                - 第26章：智能体评估方法: part7/ch26_evaluation_methods.md
                - 第27章：基准测试、性能分析与容量规划: part7/ch27_benchmarking_capacity.md
                - 第28章：可靠性与故障工程: part7/ch28_reliability_failure.md
                - 第29章：安全、系统安全与对齐: part7/ch29_security_safety_alignment.md
                - 第30章：生产部署、监控与治理: part7/ch30_production_governance.md
            - 第八篇：应用、综合项目与未来方向:
                - 本篇目录: part8/index.md
                - 第31章：软件工程与知识工作中的智能体人工智能: part8/ch31_software_knowledge_work.md
                - 第32章：教育、医疗与金融中的智能体人工智能: part8/ch32_education_healthcare_finance.md
                - 第33章：企业智能体系统与实践采用: part8/ch33_enterprise_adoption.md
                - 第34章：综合项目与参考架构: part8/ch34_capstone_reference_architectures.md
                - 第35章：开放问题与未来方向: part8/ch35_open_problems.md
            - 第九篇：工程实践、可运行代码与测试:
                - 本篇目录: part9/index.md
                - 第36章：参考实现架构、配置与可复现环境: part9/ch36_reference_implementation.md
                - 第37章：智能体单元测试、集成测试与端到端测试: part9/ch37_agent_testing.md
                - 第38章：评估回归、故障注入与可观测测试: part9/ch38_regression_fault_injection.md
                - 第39章：部署演练、持续交付与工程综合实践: part9/ch39_deployment_continuous_delivery.md
            - 附录:
                - 附录A：术语与缩略语: appendix_a_terms.md
                - 附录B：智能体评估指标与测量方法: appendix_b_metrics.md
                - 附录C：接口、模式与事件轨迹: appendix_c_schemas.md
                - 附录D：部署档位与验收模板: appendix_d_deployment.md
                - 附录E：模型、工具、提示与知识配置记录: appendix_e_config.md
                - 附录F：安全、隐私与治理清单: appendix_f_security.md
                - 附录G：故障诊断与恢复手册: appendix_g_failures.md
                - 附录H：参考文献与延伸阅读: appendix_h_reading.md
            - 后记与版本说明: afterword.md
        - locale: en
          name: English
          build: true
          site_name: "Agentic AI Systems: From Large Language Models to Real-World Agents"
          theme:
            language: en
          nav:
